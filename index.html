<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e40af" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Учебный портал" />
  <meta name="description" content="Учебный портал для студентов технических специальностей СПО" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-192.png" />

  <title>Учебный портал СПО</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Экран загрузки -->
    <div id="loading-screen" class="screen active">
      <div class="loader"></div>
      <p>Загрузка портала...</p>
    </div>

    <!-- Экран авторизации (Email + Пароль) -->
    <div id="auth-screen" class="screen">
      <div class="auth-card">
        <h1>Учебный портал</h1>
        <p class="subtitle">Вход для студентов и преподавателей</p>

        <form id="login-form" autocomplete="on">
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="username"
              required
              placeholder="student@example.com"
              inputmode="email"
            />
          </div>
          <div class="form-group">
            <label for="password">Пароль</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              placeholder="••••••••"
            />
          </div>
          <button type="submit" class="btn btn-primary" id="login-btn">
            Войти
          </button>
        </form>

        <p id="auth-error" class="error-message" hidden></p>
      </div>
    </div>

    <!-- Основной экран -->
    <div id="main-screen" class="screen">
      <header class="header">
        <div class="header-left">
          <h1 class="logo">Учебный портал</h1>
        </div>
        <div class="header-right">
          <span id="user-name" class="user-name"></span>
          <button id="logout-btn" class="btn btn-outline">Выйти</button>
        </div>
      </header>

      <main class="content">
        <div id="dashboard">
          <h2>Добро пожаловать!</h2>
          <p id="welcome-text"></p>
          <!-- Здесь будут курсы, тесты и т.д. -->
        </div>
      </main>
    </div>
  </div>

  <!-- Порядок важен: сначала api.js, потом app.js -->
  <script src="/api.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
