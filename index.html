<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>МДК Портал - Учебный портал</title>
    <link rel="icon" href="data:,">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css?v=12">
    <link rel="stylesheet" href="./style-bg-fix.css?v=5">
    <link rel="stylesheet" href="./animations.css">
    <link rel="stylesheet" href="./games-visual.css?v=4">
    <link rel="stylesheet" href="./lecture-methodical.css">
</head>
<body>
    <div id="loginOverlay" class="login-overlay" style="display: flex;">
        <div class="login-shell">
            <div style="text-align: center; margin-bottom: 20px;">
                <h2 style="color: var(--accent); margin-bottom: 5px;">МДК Портал</h2>
                <p style="color: var(--muted); font-size: 14px;">Авторизация в системе</p>
            </div>
            <form id="unifiedLoginForm" class="login-card">
                <input type="text" id="loginEmail" placeholder="Email (например: student_n@portal.ru)" required>
                <input type="password" id="loginPassword" placeholder="Пароль" required>
                <button type="button" id="btnLoginUnified" class="btn" style="width: 100%; margin-top: 10px; padding: 12px;">Войти</button>
                <div style="text-align: center; margin-top: 15px; font-size: 12px; color: var(--muted);">
                    <p>Нет аккаунта? Получите ссылку или QR-код приглашения у преподавателя.</p>
                    <button type="button" class="btn ghost" id="showRegisterBtn" style="width:100%;margin-top:8px;">Регистрация по приглашению</button>
                </div>
            </form>
            <form id="portalRegisterForm" class="login-card" style="display:none;margin-top:12px;">
                <h3>Регистрация студента</h3>
                <input id="regName" type="text" placeholder="ФИО" required>
                <input id="regGroup" type="text" placeholder="Группа" required>
                <input id="regEmail" type="email" placeholder="Email" required>
                <input id="regPassword" type="password" minlength="8" placeholder="Пароль (не менее 8 символов)" required>
                <input id="regInvite" type="text" placeholder="Код приглашения" required>
                <button type="submit" class="btn" id="btnRegister" style="width:100%;margin-top:10px;">Зарегистрироваться</button>
                <button type="button" class="btn ghost" id="hideRegisterBtn" style="width:100%;margin-top:6px;">Назад ко входу</button>
            </form>
        </div>
    </div>
    <header class="topbar">
        <div class="brand" style="display: flex; align-items: center; gap: 10px;">
            <button class="burger-btn" id="burgerBtn"><span></span><span></span><span></span></button>
            <span class="brand-badge" id="mainLogo">МДК Портал</span>
            <select id="mdkSelector" class="group-select" style="background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px; font-size: 13px; outline: none;" onchange="if(this.value==='ENGLISH_PORTAL'){window.open('https://annashirockix-cmyk.github.io/-/','_blank','noopener,noreferrer');this.value=window.state.activeCourseId||'07.01';return;} window.state.activeCourseId=this.value;window.saveStudentData();window.renderHomePage();">
                <option value="07.01">МДК 07.01 (ЧПУ)</option>
                <option value="04.01">МДК 04.01 (Диагностика)</option>
                <option value="02.01">МДК 02.01 (Сборка)</option>
                <option value="02.02">МДК 02.02 (Программирование)</option>
                <option value="MCAM">Mastercam</option>
            </select>
        </div>
        <div class="topbar-status">
            <span class="status-pill" id="xpCount">🌟 0 XP</span>
            <div class="user-chip" onclick="location.hash = '#/profile'" style="cursor: pointer;">
                <div id="userChipAvatar" style="width: 28px; height: 28px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; overflow: hidden;">👨‍🎓</div>
                <div style="display: flex; flex-direction: column; line-height: 1.2;">
                    <span id="userChipName" style="font-size: 12px; font-weight: bold;">Гость</span>
                    <span id="userChipGroup" style="font-size: 10px; color: var(--muted);">—</span>
                </div>
            </div>
            <button class="btn ghost" onclick="window.handleLogout()" style="padding: 5px 10px; font-size: 12px;">Выйти</button>
        </div>
    </header>
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <nav class="drawer" id="drawer">
        <div class="drawer-head">
            <span style="font-weight: bold; color: var(--accent);">Навигация</span>
            <button class="drawer-close" id="drawerClose">✕</button>
        </div>
        <div class="drawer-nav">
            <a href="#/" class="drawer-item">🏠 Главная</a>
            <a href="#/profile" class="drawer-item">👤 Личный кабинет</a>
            <a href="#/games" class="drawer-item">🎮 Игры</a>
            <a href="#/journal" class="drawer-item">📋 Журнал</a>
            <a href="#/admin" class="drawer-item">⚙️ Админка</a>
            <a href="javascript:void(0)" class="drawer-item" onclick="window.clearCache()">🧹 Очистить кэш</a>
        </div>
    </nav>
    <main>
        <div id="crumbs" style="padding: 10px 20px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--border);"></div>
        <div id="app" style="padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%;"></div>
    </main>
    <script src="./api.js?v=13"></script>
    <script src="./data-global.js?v=6"></script>
    <script src="./data-0701.js"></script>
    <script src="./data-0401.js"></script>
    <script src="./data-0201.js"></script>
    <script src="./data-0202.js"></script>
    <script src="./data-mastercam.js"></script>
    <script src="./data-extra.js"></script>
    <script src="./app.js?v=19"></script>
    <script src="./app-offline-login.js?v=4"></script>
    <script src="./games.js?v=5"></script>
    <script src="./network-detective.js?v=8"></script>
    <script src="./party-games.js?v=2"></script>
    <script src="./party-games-fix.js?v=2"></script>
    <script src="./network-party-games.js?v=4"></script>
    <script src="./coop-detective.js?v=4"></script>
    <script src="./games-ui-enhance.js?v=3"></script>
    <script src="./portal-final.js?v=14"></script>
    <script src="./extra.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js').catch(function(){});
            });
        }
    </script>
</body>
</html>
