<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учебный портал МДК</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<!-- Включаем тему "хакер" для зеленого неона -->
<body data-theme="hacker">

    <!-- Окно входа, которое теперь всегда видно -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-shell">
            <div class="hero" style="box-shadow: none; padding: 0 0 20px 0; background: transparent; border: none;">
                <h1>ОПЕРАТОР СТАНКОВ С ПУ</h1>
                <p>15.02.16 Технология машиностроения · ПМ.07</p>
            </div>
            
            <div class="login-grid">
                <!-- Вход студента -->
                <div class="login-card">
                    <h2 class="steps-title" style="margin-top: 0;">ВХОД СТУДЕНТА</h2>
                    <form id="studentForm">
                        <input type="text" id="studentName" name="studentName" autocomplete="name" placeholder="ФИО (Иванов Иван)">
                        <input type="text" id="studentGroup" name="studentGroup" autocomplete="off" placeholder="Группа (ТМ-4)">
                        <button type="submit" class="btn" style="width: 100%;">Войти</button>
                    </form>
                </div>

                <!-- Вход преподавателя -->
                <div class="login-card">
                    <h2 class="steps-title" style="margin-top: 0;">ВХОД ПРЕПОДАВАТЕЛЯ</h2>
                    <form id="teacherForm">
                        <input type="text" id="teacherLogin" name="username" autocomplete="username" placeholder="Логин" value="teacher">
                        <input type="password" id="teacherPass" name="password" autocomplete="current-password" placeholder="Пароль" value="teacher">
                        <button type="submit" class="btn" style="width: 100%;">Войти в журнал</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Основной контент, который будет показан после входа -->
    <div id="appContent" style="display: none;">
        <div class="topbar">
            <div class="brand-badge">ПОРТАЛ МДК</div>
            <div class="status-pill" id="userStatus">Гость</div>
            <button class="btn ghost" id="logoutBtn" style="margin-left: auto;">Выйти</button>
        </div>

        <main id="app">
            <div class="module">
                <h2>Добро пожаловать в личный кабинет!</h2>
                <p>Выберите нужный раздел в меню ниже.</p>
            </div>

            <div class="module">
                <div class="steps-title">Навигация</div>
                <ul style="list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 10px;">
                    <li><button class="tab active">Главная</button></li>
                    <li><button class="tab">Личный кабинет</button></li>
                    <li><button class="tab">Журнал (Оценки)</button></li>
                    <li><button class="tab">Расписание</button></li>
                </ul>
            </div>
        </main>
    </div>

    <!-- Уведомления -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
</body>
</html>
