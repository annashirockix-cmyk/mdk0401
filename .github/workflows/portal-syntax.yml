name: Portal syntax checks
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check changed JavaScript modules
        run: |
          set -e
          for file in api.js app.js portal-final.js portal-genz.js rating-subjects.js workbooks.js network-party-games.js network-detective.js coop-detective.js sprut-tp-document-examples.js certificate-supplement.js avatar-studio.js teacher-tasks.js reports.js service-worker.js teacher-controls.js shop.js laboratory.js pdf-viewer.js materials-simulator.js machining-simulator.js english-vpr-engine.js english-vpr-exams.js english-proficiency-lab.js; do
            echo "Checking $file"
            node --check "$file"
          done
          echo "Checking Google Apps Script backend"
          node --check < Code.gs
      - name: Check notification center contract
        run: node scripts/check-notification-contract.mjs
      - name: Check assignment workflow
        run: node --test scripts/assignment-workflow.test.mjs
      - name: Check portal enhancements
        run: node --test scripts/portal-enhancements.test.mjs
      - name: Check workbook cache and print layout
        run: node --test scripts/workbook-image-cache.test.mjs scripts/workbook-print.test.mjs
      - name: Check custom course content rendering
        run: node --test scripts/course-content-editor.test.mjs
      - name: Install Playwright CLI for browser audit
        run: npm install --global playwright@1.62.0
      - name: Install Chromium for workbook print audit
        run: PLAYWRIGHT_MODULE_PATH="$(npm root -g)/playwright" playwright install --with-deps chromium
      - name: Run real-browser A4 and PDF audit
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/workbook-audit-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          PLAYWRIGHT_MODULE_PATH="$(npm root -g)/playwright" node scripts/workbook-browser-print-audit.mjs
      - name: Upload workbook PDF audit samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbook-a4-pdf-audit
          path: artifacts/workbooks/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run real-browser course constructor round-trip audit
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/constructor-audit-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          PLAYWRIGHT_MODULE_PATH="$(npm root -g)/playwright" node scripts/course-constructor-browser-audit.mjs
      - name: Upload constructor audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-constructor-roundtrip-audit
          path: artifacts/constructors/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run real-browser certificate A4 landscape audit
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/certificate-audit-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          PLAYWRIGHT_MODULE_PATH="$(npm root -g)/playwright" node scripts/certificate-browser-print-audit.mjs
      - name: Upload certificate PDF audit sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificate-a4-landscape-audit
          path: artifacts/certificate/
          if-no-files-found: ignore
          retention-days: 7
      - name: Check inline scripts in HTML
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, tempfile
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.active=False; self.parts=[]; self.current=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script' and not dict(attrs).get('src'): self.active=True; self.current=[]
              def handle_data(self, data):
                  if self.active: self.current.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.active:
                      self.parts.append(''.join(self.current)); self.active=False
          for html in ['index.html', 'g_code_full.html']:
              parser=Scripts(); parser.feed(Path(html).read_text(encoding='utf-8'))
              for i, source in enumerate(parser.parts, 1):
                  if not source.strip(): continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8') as tmp:
                      tmp.write(source); tmp.flush()
                      print(f'Checking {html} inline script #{i}')
                      subprocess.run(['node', '--check', tmp.name], check=True)
          PY
